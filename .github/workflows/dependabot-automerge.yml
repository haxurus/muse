name: Dependabot safe auto-merge

# Same policy as Sentinel: a Dependabot minor or patch update whose CI passed is merged
# automatically; majors and anything unclassified wait for a human. Merges made with the
# workflow token do not trigger push workflows, so the deploy is dispatched explicitly.
# This workflow never checks out or runs the pull request's code.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.actor.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Merge verified minor or patch Dependabot update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$pr_number" ]; then
            echo "No pull request associated with this CI run."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPO/pulls/$pr_number")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          pr_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"

          if [ "$state" != "open" ] || [ "$author" != "dependabot[bot]" ] || [ "$base_ref" != "main" ]; then
            echo "Not an open Dependabot PR against main."
            exit 0
          fi

          case "$head_ref" in
            dependabot/*) ;;
            *) echo "Unexpected head branch."; exit 1 ;;
          esac

          # Only the commit that passed CI may be merged.
          if [ "$pr_head_sha" != "$HEAD_SHA" ]; then
            echo "The pull request changed after this CI run."
            exit 0
          fi

          # Dependabot lists every bumped dependency with its update type in the commit message
          # (grouped updates list several): all of them must be minor or patch.
          message="$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.message')"
          types="$(grep -Eo 'update-type: version-update:semver-[a-z]+' <<<"$message" || true)"
          if [ -z "$types" ] || grep -Evq 'semver-(minor|patch)$' <<<"$types"; then
            echo "Major or unclassified update - not auto-merging."
            exit 0
          fi

          gh pr merge "$pr_number" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
          gh workflow run deploy.yml --repo "$REPO" --ref main
