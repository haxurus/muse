name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.0", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: node --check dashboard/dashboard.js
      - run: yarn test
      - run: yarn build
      - name: Validate production compose
        if: matrix.node-version == '22'
        run: |
          set -euo pipefail
          cp deploy/.env.production.example deploy/.env
          mkdir -p deploy/secrets deploy/config
          cp deploy/workers.json deploy/config/workers.json
          for secret in \
            orchestrator_api_token dashboard_discord_client_secret \
            discord_token_01 discord_token_02 discord_token_03 discord_token_04 discord_token_05 \
            control_token_01 control_token_02 control_token_03 control_token_04 control_token_05 \
            youtube_api_key spotify_client_id spotify_client_secret; do
            printf 'ci-placeholder\n' > "deploy/secrets/$secret"
          done
          MUSE_IMAGE="ghcr.io/haxurus/muse@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            docker compose -f deploy/docker-compose.prod.yml config -q
      - name: Validate playback pilot overlays
        if: matrix.node-version == '22'
        env:
          MUSE_IMAGE: ghcr.io/haxurus/muse@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          set -euo pipefail
          # Mirrors muse-deploy: same project directory, --env-file and -f ordering.
          pilots=(one two three four five)
          for ((mask=1; mask<32; mask++)); do
            compose_files=(-f deploy/docker-compose.prod.yml)
            for index in "${!pilots[@]}"; do
              if (( (mask & (1 << index)) != 0 )); then
                compose_files+=(-f "deploy/docker-compose.bot-${pilots[$index]}-playback.yml")
              fi
            done
            echo "Checking playback pilot combination $mask of 31"
            docker compose --project-name muse --project-directory deploy \
              --env-file deploy/.env "${compose_files[@]}" config -q
          done
      - name: Build production image
        if: matrix.node-version == '22'
        run: docker build -t muse-ci .
      - name: Verify deployment bundle and yt-dlp pin in the image
        if: matrix.node-version == '22'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ARG YT_DLP_VERSION=//p' Dockerfile)"
          test "$(docker run --rm --entrypoint yt-dlp muse-ci --version)" = "$version"
          cid="$(docker create muse-ci)"
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          bundle="$(mktemp -d)"
          docker cp "$cid:/opt/muse-deploy/." "$bundle/"
          for file in docker-compose.prod.yml workers.json \
            docker-compose.bot-one-playback.yml docker-compose.bot-two-playback.yml \
            docker-compose.bot-three-playback.yml docker-compose.bot-four-playback.yml \
            docker-compose.bot-five-playback.yml; do
            cmp "$bundle/$file" "deploy/$file"
          done

  shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check
        run: |
          set -euo pipefail
          bash -n ops/install-vps.sh
          bash -n ops/muse-deploy
          sh -n ops/muse-deploy-entrypoint
          sh -n security/host-firewall.sh
          python3 -m py_compile .github/scripts/yt-dlp-lock.py
      - name: ShellCheck
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck ops/*.sh ops/muse-deploy ops/muse-deploy-entrypoint security/*.sh
      - name: yt-dlp lock matches the Dockerfile pin
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ARG YT_DLP_VERSION=//p' Dockerfile)"
          grep -Fqx "yt-dlp[default]==${version} \\" deploy/yt-dlp-requirements.txt
