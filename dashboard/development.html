<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0913">
  <meta name="robots" content="noindex, nofollow">
  <title>{{meta.developmentTitle}}</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
  <main class="public-site development-page">
    <header class="site-header">
      <div class="site-container site-nav">
        <a class="brand" href="{{prefix}}" aria-label="{{nav.homeLabel}}">
          <svg class="brand-mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <rect x="3.5" y="3.5" width="25" height="25" rx="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M13 21V10.6l8.5-2.1v10.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10.9" cy="21" r="2.3" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <circle class="brand-dot" cx="19.4" cy="18.8" r="2.4"/>
          </svg>
          <span>Muse</span>
        </a>
        <div class="site-nav-lang">
          {{{languageSwitcher}}}
        </div>
      </div>
    </header>

    <section class="development-hero">
      <div class="site-container development-card">
        <span class="kicker">{{development.kicker}}</span>
        <h1>{{development.title}}</h1>
        <p>{{development.text}}</p>
        <p>{{development.follow}}</p>
        <div class="development-actions">
          <a class="button button-primary button-lg" href="https://github.com/haxurus/muse" target="_blank" rel="noreferrer noopener">{{development.github}}</a>
          <a class="button button-secondary button-lg" href="https://github.com/haxurus/muse/fork" target="_blank" rel="noreferrer noopener">{{development.fork}}</a>
        </div>
        <a class="development-home-link" href="{{prefix}}">
          <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
          {{development.back}}
        </a>
      </div>
    </section>

    <footer class="site-footer">
      <div class="site-container">
        <div class="site-footer-bottom">
          <span>{{footer.credits}}</span>
          <span class="mono">{{footer.tagline}}</span>
        </div>
      </div>
    </footer>
  </main>
</body>
</html>
